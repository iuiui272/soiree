<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soirée</title>
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soirée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
// Set theme + accent before first paint to avoid a flash.
(function(){try{var s=JSON.parse(localStorage.getItem('soiree.settings')||'{}');var t=s.theme||'system';
var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';
if(s.accent)document.documentElement.style.setProperty('--accent',s.accent);}catch(e){}})();
</script>
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --accent:#0a84ff;--on-accent:#fff;
  --bg:#f2f2f7;--surface:#fff;--raised:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--glass:rgba(249,249,251,.78);--thumb:#fff;
  --green:#34c759;--red:#ff3b30;--orange:#ff9f0a;
  /* springs as CSS easing: soft for layout, lively for small controls */
  --soft:linear(0,.2 5%,.62 12%,.88 20%,1.02 30%,1.04 38%,1.02 48%,1.005 60%,1);
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  /* concentric radii: inner = outer - padding */
  --r-lg:28px;--r-md:20px;--r-sm:12px;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000;--surface:#1c1c1e;--raised:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--glass:rgba(30,30,32,.78);--thumb:#636366;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--label);-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sq{border-radius:var(--rad,var(--r-md))}
@supports (corner-shape:squircle){.sq,.poster,.sheet,.modal-card,.group,.btn,.app-icon{corner-shape:squircle}}
.ios-app body::before{content:'';position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 4px);background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:9000;pointer-events:none}

/* ---------- views ---------- */
.view{min-height:100dvh}
.view.enter{animation:vin .6s var(--soft) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
::view-transition-group(poster){animation-duration:.65s;animation-timing-function:var(--soft)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.3s}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.narrow{max-width:420px;margin:0 auto;padding:0 20px}

/* ---------- bars + buttons ---------- */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;min-height:calc(env(safe-area-inset-top,0px) + 56px);
  transition:background .3s,box-shadow .3s}
.bar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 .5px 0 var(--sep)}
.bar .ttl{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .25s;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar.scrolled .ttl,.bar.solid .ttl{opacity:1}
.bar .side{display:flex;gap:10px;align-items:center;z-index:1}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 0 0 .5px var(--sep),0 2px 8px rgba(0,0,0,.06);transition:transform .45s var(--spring)}
.rb:active{transform:scale(.88)}
.rb.accent{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.rb.sm{width:30px;height:30px}
.tbtn{font-size:17px;color:var(--accent);padding:8px 4px}
.tbtn.b{font-weight:600}
.ico{display:inline-grid;place-items:center}
.ico svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;transition:transform .45s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.danger{background:var(--fill);color:var(--red)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 16px;font-size:15px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- home ---------- */
.large{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 16px;margin-top:20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;text-align:left;width:100%;transition:transform .5s var(--spring)}
.card:active{transform:scale(.96)}
.card .cap{padding:10px 4px 0;font-size:13px;color:var(--label2)}
.card .cap b{display:block;color:var(--label);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:64px 20px;display:grid;justify-items:center;gap:10px}
.empty .app-icon{margin-bottom:8px}
.empty p{color:var(--label2);max-width:300px}
.empty .btn{margin-top:14px}
.banner{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);--rad:var(--r-md);margin-bottom:6px}
.banner .bt{flex:1;min-width:0;font-size:13px;color:var(--label2);line-height:1.3}
.banner .bt b{display:block;font-size:15px;color:var(--label)}
.app-icon{width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,#ff9a5a,#ff5e7e 50%,#7b5cff);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px -6px rgba(123,92,255,.5)}
.app-icon svg{width:56%;height:56%;fill:#fff}
.app-icon.sm{width:40px;height:40px;border-radius:10px}
.app-icon.lg{width:96px;height:96px;border-radius:22px}

/* ---------- segmented, switch, groups ---------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--fill);border-radius:10px;padding:2px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));background:var(--thumb);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .55s var(--spring)}
.seg-b{position:relative;z-index:1;padding:6px 6px;font-size:13px;font-weight:500;min-height:32px}
.seg-b.on{font-weight:600}
.seg.big .seg-b{font-size:15px;min-height:36px}
.sw{width:51px;height:31px;border-radius:99px;background:var(--fill2);position:relative;flex:none;transition:background .3s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .5s var(--spring)}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;position:relative}
.row+.row::before{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.row>label,.row>.lab{flex:none;color:var(--label)}
.row .val{margin-left:auto;color:var(--label2);font-size:15px}
.row input:not([type=range]):not([type=color]):not([type=checkbox]),.row textarea{flex:1;min-width:0;border:0;background:none;outline:0;padding:14px 0;font-size:17px;border-radius:0}
.row textarea{resize:none;min-height:88px;line-height:1.35}
.row input[type=datetime-local]{text-align:right;min-height:48px}
.row input::placeholder,.row textarea::placeholder{color:var(--label3)}
.row.col{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px}
.row.col .top{display:flex;justify-content:space-between}
.row input[type=range]{width:100%;accent-color:var(--accent)}
.h{font-size:13px;font-weight:500;color:var(--label2);margin:24px 16px 8px}
.note{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.4}
input[type=color]{width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:2px solid var(--surface);box-shadow:0 0 0 1px var(--sep);border-radius:50%}
input[type=color]::-moz-color-swatch{border:2px solid var(--surface);border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{padding:8px 14px;border-radius:999px;background:var(--fill);font-size:15px;transition:transform .4s var(--spring),background .2s;display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px}
.sw-p{aspect-ratio:1;--rad:var(--r-sm);transition:transform .45s var(--spring);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.sw-p:active{transform:scale(.9)}
.sw-p.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.colors{display:flex;gap:14px;align-items:center;padding:12px 16px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:10px}
.emoji-grid button{font-size:30px;line-height:1;aspect-ratio:1;border-radius:12px;transition:transform .4s var(--spring),background .2s}
.emoji-grid button:active{transform:scale(.8);background:var(--fill)}
.meter{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:2px 0 4px}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:var(--green);transition:width .6s var(--soft),background .3s}
.stack{display:grid;gap:10px;padding:0 0 4px}

/* ---------- poster (the invite itself) ---------- */
.pw{container-type:inline-size;width:100%;aspect-ratio:3/4;position:relative}
.poster{position:absolute;inset:0;overflow:hidden;border-radius:calc(var(--c,8.9) * 1cqw);isolation:isolate;color:#fff;background:#888;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 22px 44px -14px rgba(0,0,0,.4)}
.poster[data-ink=dark]{color:#1d1d1f}
.poster>*{position:absolute}
.p-bg,.p-sharp,.p-tint,.p-shim{inset:0;width:100%;height:100%}
.p-bg{transform:scale(var(--bs,1));background-size:cover;background-position:center}
.p-sharp{object-fit:cover;opacity:0;transition:opacity .7s;transform:scale(var(--bs,1))}
.p-sharp.on{opacity:1}
.p-shim{display:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;mix-blend-mode:soft-light}
.poster.shim .p-shim{display:block;animation:shim 3.6s linear infinite}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}
.p-fx{inset:0;width:100%;height:100%;pointer-events:none}
.p-content{inset:0;padding:9cqw;display:flex;flex-direction:column;gap:1.2cqw;font-family:var(--ff);pointer-events:none}
.lo-center .p-content{justify-content:center;align-items:center;text-align:center}
.lo-left .p-content{justify-content:flex-start;align-items:flex-start;text-align:left;padding-top:14cqw}
.lo-bottom .p-content{justify-content:flex-end;align-items:flex-start;text-align:left}
.p-title{font-size:12.5cqw;line-height:1.03;font-weight:var(--fw,800);letter-spacing:var(--ls,-.035em);text-transform:var(--tt,none);overflow-wrap:anywhere;text-wrap:balance;max-width:100%}
.p-title.ph{opacity:.45}
.p-when{margin-top:3cqw;font-size:4.6cqw;font-weight:600;line-height:1.25;white-space:pre-line}
.p-host,.p-loc{font-size:4.1cqw;opacity:.86;line-height:1.3}
.p-desc{margin-top:3cqw;font-size:3.7cqw;opacity:.84;line-height:1.38;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;white-space:pre-line}
.poster[data-ink=light] .p-content{text-shadow:0 1px 14px rgba(0,0,0,.16)}
.mini .p-desc,.mini .p-host,.mini .p-loc{display:none}
.mini .p-title{font-size:13cqw}
.p-stk{inset:0;pointer-events:none}
.stk{position:absolute;line-height:1;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-size:calc(var(--s,18) * 1cqw);filter:drop-shadow(0 1cqw 1.6cqw rgba(0,0,0,.25));user-select:none;-webkit-user-select:none;touch-action:none;border-radius:3cqw}
.edit .stk{pointer-events:auto;cursor:grab}
.edit .stk.sel{outline:.5cqw dashed rgba(255,255,255,.9);outline-offset:1cqw}

/* ---------- editor ---------- */
.editor{position:relative;overflow:hidden;overflow:clip;height:100dvh;min-height:0}
.editor .bar{position:fixed;left:0;right:0}
.stage{position:fixed;inset:0;overflow:hidden}
.fit{position:absolute;left:50%;top:0;width:var(--w0,340px);transform-origin:top center;transform:translate(-50%,var(--ty,70px)) scale(var(--s,1));transition:transform .65s var(--soft)}
.sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sh,80dvh);max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--glass);-webkit-backdrop-filter:blur(32px) saturate(1.8);backdrop-filter:blur(32px) saturate(1.8);
  border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -.5px 0 var(--sep),0 -18px 50px rgba(0,0,0,.14);
  transform:translateY(var(--sy,60%));transition:transform .6s var(--soft);z-index:40}
.sheet-head{touch-action:none;padding:8px 16px 10px;cursor:grab}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 40px + var(--hid,0px));-webkit-overflow-scrolling:touch}
@media(min-width:900px){
  .editor{display:grid;grid-template-columns:1fr 460px;height:100dvh}
  .stage{position:relative;inset:auto}
  .sheet{position:relative;transform:none!important;max-width:none;height:100dvh;border-radius:0;box-shadow:-.5px 0 0 var(--sep);padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
  .grab{display:none}
  .sheet-head{cursor:default}
  .editor .bar{background:none}
}

/* ---------- invite detail ---------- */
.hero{max-width:380px;margin:4px auto 0;padding:0 20px}
.until{display:flex;justify-content:center;margin:18px 0 6px}
.until span{padding:7px 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600}
.actions{display:grid;gap:10px;margin:18px 0 8px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-row{display:flex;gap:14px;align-items:center;padding:12px 16px;position:relative;min-height:60px}
.detail-row+.detail-row::before{content:'';position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--sep)}
.detail-row .ci{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.detail-row .ci svg{width:19px;height:19px}
.detail-row b{display:block;font-weight:600}
.detail-row small{display:block;color:var(--label2);font-size:14px;line-height:1.3}
.detail-row a{color:inherit;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:14px 8px;text-align:center;position:relative}
.stats div+div::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:.5px;background:var(--sep)}
.stats b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:13px;color:var(--label2)}
.guest{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative}
.guest+.guest::before{content:'';position:absolute;left:62px;right:0;top:0;height:.5px;background:var(--sep)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;flex:none}
.guest .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guest .st{font-size:15px;font-weight:500}
.st.g{color:var(--green)}.st.m{color:var(--orange)}.st.n{color:var(--label2)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:28px 16px 8px}
.sechead h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsvp button{padding:14px 4px;border-radius:var(--r-sm);background:var(--fill);font-weight:600;font-size:15px;display:grid;gap:4px;justify-items:center;transition:transform .45s var(--spring),background .25s,color .25s}
.rsvp button:active{transform:scale(.94)}
.rsvp button span{font-size:22px;line-height:1}
.rsvp button.on{background:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:14px;margin-left:auto}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;display:grid;place-items:center}
.stepper b{min-width:18px;text-align:center}
.foot{text-align:center;padding:28px 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
.linkbtn{color:var(--accent);font-size:15px;padding:8px}
.pastebox{display:grid;gap:10px;margin-top:10px}
.pastebox textarea{width:100%;min-height:76px;border:0;border-radius:var(--r-sm);background:var(--fill);padding:12px;resize:none;font-size:15px;outline:0}

/* ---------- gate ---------- */
.gate{display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(120% 70% at 20% 0%,color-mix(in srgb,#ff9a5a 40%,transparent),transparent 60%),radial-gradient(100% 60% at 100% 100%,color-mix(in srgb,#7b5cff 40%,transparent),transparent 60%),var(--bg)}
.gate-card{width:100%;max-width:400px;display:grid;gap:14px;justify-items:center;text-align:center}
.gate h1{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.gate .lead{color:var(--label2);text-wrap:pretty}
.steps{list-style:none;margin:14px 0 4px;padding:0;width:100%;display:grid;gap:10px;text-align:left;counter-reset:s}
.steps li{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--r-md);counter-increment:s;font-weight:500}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.steps li .ico{margin-left:auto;color:var(--accent)}
.fine{font-size:13px;color:var(--label2)}

/* ---------- modal (settings) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;transition:opacity .35s}
.scrim.in{opacity:1}
.modal-card{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:min(92dvh,860px);background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:101;
  transform:translateY(100%);transition:transform .6s var(--soft);display:flex;flex-direction:column;overflow:hidden}
.modal-card.in{transform:none}

      el('div', { class: 'row' }, el('span', {}, 'Show outline'), el('span', { style: 'margin-left:auto' }, toggle(r.on, v => { r.on = v; saveSettings(); applyRing(); redrawMock(); }))),
      el('div', { class: 'row' }, el('span', { class: 'lab' }, 'Style'), el('div', { style: 'margin-left:auto;width:230px' }, seg([['color', 'Color'], ['rainbow', 'Rainbow'], ['aurora', 'Aurora']], r.style, v => { r.style = v; saveSettings(); applyRing(); redrawMock(); draw(); }))),
      r.style === 'color' ? el('div', { class: 'row' }, el('span', {}, 'Color'), el('span', { style: 'margin-left:auto' }, el('input', { type: 'color', value: r.color || settings.accent, 'aria-label': 'Outline color', oninput: e => { r.color = e.target.value; saveSettings(); applyRing(); redrawMock(); } }))) : null,
      el('div', { class: 'row' }, el('span', {}, 'Animate'), el('span', { style: 'margin-left:auto' }, toggle(r.anim, v => { r.anim = v; saveSettings(); applyRing(); redrawMock(); }))),
      slider('Thickness', 1.5, 6, .5, r.w, v => v + ' pt', v => { r.w = v; saveSettings(); applyRing(); redrawMock(); }),
      m ? slider('Nudge up or down', -6, 6, .5, r.dy, v => v, v => { r.dy = v; saveSettings(); applyRing(); }) : null,
      m ? slider('Size', .9, 1.2, .01, r.sc, v => Math.round(v * 100) + '%', v => { r.sc = v; saveSettings(); applyRing(); }) : null));
    kids.push(el('p', { class: 'note' }, m ? `Found a Dynamic Island screen (${screenKey().replace('x', ' × ')}: ${m.name}).${STANDALONE || SIM ? '' : ' The outline appears when Soirée is opened from the Home Screen.'} Positions are approximate; use the sliders to line it up.`
      : `No Dynamic Island found on this device (screen ${screenKey().replace('x', ' × ')}). The preview above shows your style; it appears on supported iPhones when opened from the Home Screen. Display Zoom can hide it.`));

    kids.push(el('div', { class: 'h' }, 'This device'), el('div', { class: 'group' },
      el('div', { class: 'row' }, el('span', {}, 'Device'), el('span', { class: 'val' }, DEVICE)),
      el('div', { class: 'row' }, el('span', {}, 'Installed as app'), el('span', { class: 'val' }, STANDALONE ? 'Yes' : 'No')),
      el('div', { class: 'row' }, el('span', {}, 'Saved on device'), el('span', { class: 'val', id: 'st-use' }, '…')),
      el('div', { class: 'row' }, el('span', {}, 'Storage protected'), el('span', { class: 'val', id: 'st-per' }, '…')),
      DB.mem ? el('div', { class: 'row' }, el('span', { style: 'color:var(--red)' }, 'Private mode: invites won’t be kept')) : null));
    (async () => {
      try { const e = await navigator.storage.estimate(); $('#st-use') && ($('#st-use').textContent = e.usage < 1024 * 1024 ? Math.max(1, Math.round(e.usage / 1024)) + ' KB' : (e.usage / 1048576).toFixed(1) + ' MB'); } catch (x) { $('#st-use') && ($('#st-use').textContent = 'Unknown'); }
      try { const p = await navigator.storage.persisted(); $('#st-per') && ($('#st-per').textContent = p ? 'Yes' : 'Not yet'); } catch (x) { $('#st-per') && ($('#st-per').textContent = 'Unknown'); }
    })();
    const imp = el('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); for (const x of d.events || []) await DB.put('events', x); for (const x of d.received || []) await DB.put('received', x); for (const x of d.replies || []) await DB.put('replies', x); if (d.settings) { Object.assign(settings, d.settings, { ring: { ...DEFAULTS.ring, ...(d.settings.ring || {}) } }); saveSettings(); applyTheme(); applyRing(); } toast('Backup restored'); close(); render(); }
      catch (err) { toast('That file isn’t a Soirée backup'); }
    } });
    kids.push(el('div', { class: 'h' }, 'Backup'), el('div', { class: 'group' },
      el('div', { class: 'row' }, el('button', { class: 'linkbtn', style: 'padding:14px 0', onclick: async () => { const data = { v: 1, events: await DB.all('events'), received: await DB.all('received'), replies: await DB.all('replies'), settings }; saveBlob('soiree-backup.json', JSON.stringify(data), 'application/json'); } }, 'Export all invites')),
      el('div', { class: 'row' }, el('button', { class: 'linkbtn', style: 'padding:14px 0', onclick: () => imp.click() }, 'Restore from backup'), imp),
      el('div', { class: 'row' }, el('button', { class: 'linkbtn', style: 'padding:14px 0;color:var(--red)', onclick: async () => { if (!confirm('Erase every invite and reply on this device?')) return; for (const s of ['events', 'received', 'replies']) await DB.clear(s); toast('Erased'); close(); render(); } }, 'Erase everything'))));
    body.replaceChildren(...kids);
  }
  draw();
  document.body.append(scrim, card);
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add('in'); card.classList.add('in'); }));
}

/* ---------- boot ---------- */
applyTheme();
initDB().then(() => { applyRing(); render(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
